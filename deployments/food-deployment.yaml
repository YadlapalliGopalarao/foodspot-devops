
# FoodSpot - Food Service Kubernetes Deployment
# Jenkins automatically updates the Docker image tag.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: food
  namespace: application
  labels:
    app: food

spec:
  selector:
    matchLabels:
      app: food

  template:
    metadata:
      labels:
        app: food

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33

      containers:
        - name: food-service
          image: gopalarao2004/foodspot-food:b12-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: APP_NAME
              value: "food-service"

            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: foodspot-food-app
                  key: APP_KEY

            - name: LOG_CHANNEL
              value: "stderr"

            - name: LOG_LEVEL
              value: "info"

            # MySQL Configuration
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: "mysql.application.svc.cluster.local"

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              value: "foodspot_food"

            - name: DB_USERNAME
              value: "foodspot"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password

            # Laravel Configuration
            - name: SESSION_DRIVER
              value: "array"

            - name: CACHE_STORE
              value: "file"

            - name: QUEUE_CONNECTION
              value: "sync"

            # Internal Service Communication
            - name: USER_SERVICE_URL
              value: "http://user"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
