
# FoodSpot - User Service Kubernetes Deployment
# Jenkins automatically updates the image tag after a successful build.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: foodspot
  labels:
    app: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33

      containers:
        - name: user-service
          image: gopalarao2004/foodspot-user:b10-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: APP_NAME
              value: "user-service"

            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: LOG_CHANNEL
              value: "stderr"

            - name: LOG_LEVEL
              value: "info"

            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              value: "application"

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: foodspot-db
                  key: DB_HOST

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: foodspot-db
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodspot-db
                  key: DB_PASSWORD

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: foodspot-user-app
                  key: APP_KEY

            - name: SESSION_DRIVER
              value: "array"

            - name: CACHE_STORE
              value: "file"

            - name: QUEUE_CONNECTION
              value: "sync"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
