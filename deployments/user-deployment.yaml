
# FoodSpot - User Service Kubernetes Deployment
# Jenkins automatically updates the Docker image tag.
# Argo CD deploys changes to Oracle OKE.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: user
  namespace: application
  labels:
    app: user

spec:
  selector:
    matchLabels:
      app: user

  template:
    metadata:
      labels:
        app: user

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33

      containers:
        - name: user-service
          image: gopalarao2004/foodspot-user:b12-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            # Laravel Application Configuration
            - name: APP_NAME
              value: "user-service"

            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: foodspot-user-app
                  key: APP_KEY

            - name: LOG_CHANNEL
              value: "stderr"

            - name: LOG_LEVEL
              value: "info"

            # MySQL Database Configuration
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: "mysql.application.svc.cluster.local"

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              value: "foodspot_users"

            - name: DB_USERNAME
              value: "foodspot"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password

            # Laravel Runtime Configuration
            - name: SESSION_DRIVER
              value: "array"

            - name: CACHE_STORE
              value: "file"

            - name: QUEUE_CONNECTION
              value: "sync"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Temporary TCP readiness check
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
