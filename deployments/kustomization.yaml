
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: application

resources:
  - frontend-deployment.yaml
  - user-deployment.yaml
  - food-deployment.yaml
  - order-deployment.yaml
  - notification-deployment.yaml

# Jenkins continues managing the image tags.
images:
  - name: gopalarao2004/foodspot-frontend
    newName: docker.io/gopalarao2004/foodspot-frontend

  - name: gopalarao2004/foodspot-user
    newName: docker.io/gopalarao2004/foodspot-user

  - name: gopalarao2004/foodspot-food
    newName: docker.io/gopalarao2004/foodspot-food

  - name: gopalarao2004/foodspot-order
    newName: docker.io/gopalarao2004/foodspot-order

  - name: gopalarao2004/foodspot-notification
    newName: docker.io/gopalarao2004/foodspot-notification

patches:

  # Preserve original Laravel environment variables.
  # Keep the existing TCP readiness checks for now.
  - target:
      kind: Deployment
      name: ".*-service"
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/startupProbe
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10

  # User database configuration
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: user-service
      spec:
        template:
          spec:
            containers:
              - name: user-service
                env:
                  - name: DB_DATABASE
                    value: foodspot_users

  # Food database and service communication
  - target:
      kind: Deployment
      name: food-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: food-service
      spec:
        template:
          spec:
            containers:
              - name: food-service
                env:
                  - name: DB_DATABASE
                    value: foodspot_food
                  - name: USER_SERVICE_URL
                    value: http://user

  # Order database and service communication
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
      spec:
        template:
          spec:
            containers:
              - name: order-service
                env:
                  - name: DB_DATABASE
                    value: foodspot_orders
                  - name: USER_SERVICE_URL
                    value: http://user
                  - name: FOOD_SERVICE_URL
                    value: http://food
                  - name: NOTIFICATION_SERVICE_URL
                    value: http://notification

  # Notification database and communication
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-service
      spec:
        template:
          spec:
            containers:
              - name: notification-service
                env:
                  - name: DB_DATABASE
                    value: foodspot_notifications
                  - name: USER_SERVICE_URL
                    value: http://user

  # Frontend Deployment
  - target:
      kind: Deployment
      name: foodspot-frontend
    patch: |-
      - op: replace
        path: /metadata/name
        value: frontend
      - op: replace
        path: /metadata/labels/app
        value: frontend
      - op: replace
        path: /spec/selector/matchLabels/app
        value: frontend
      - op: replace
        path: /spec/template/metadata/labels/app
        value: frontend
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: nginx-routing
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: nginx-routing
            configMap:
              name: frontend-nginx-routing

  # User Deployment
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: user
      - op: replace
        path: /metadata/labels/app
        value: user
      - op: replace
        path: /spec/selector/matchLabels/app
        value: user
      - op: replace
        path: /spec/template/metadata/labels/app
        value: user

  # Food Deployment
  - target:
      kind: Deployment
      name: food-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: food
      - op: replace
        path: /metadata/labels/app
        value: food
      - op: replace
        path: /spec/selector/matchLabels/app
        value: food

  # Order Deployment
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: order
      - op: replace
        path: /metadata/labels/app
        value: order
      - op: replace
        path: /spec/selector/matchLabels/app
        value: order

  # Notification Deployment
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: notification
      - op: replace
        path: /metadata/labels/app
        value: notification
      - op: replace
        path: /spec/selector/matchLabels/app
        value: notification
