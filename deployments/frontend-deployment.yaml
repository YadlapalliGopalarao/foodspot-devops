
# FoodSpot - Frontend Kubernetes Deployment
# Jenkins automatically updates the image tag.
# Vue.js frontend served by Nginx.
# Nginx forwards /api/* requests to internal Traefik.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: application
  labels:
    app: frontend

spec:
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101

      containers:
        - name: foodspot-frontend
          image: gopalarao2004/foodspot-frontend:b12-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3

          # Nginx configuration from Kubernetes ConfigMap
          volumeMounts:
            - name: nginx-routing
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: nginx-routing
          configMap:
            name: frontend-nginx-routing
