
# FoodSpot - Frontend Kubernetes Deployment
# Jenkins automatically updates the image tag after a successful build.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: foodspot-frontend
  namespace: foodspot
  labels:
    app: foodspot-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: foodspot-frontend

  template:
    metadata:
      labels:
        app: foodspot-frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101

      containers:
        - name: foodspot-frontend
          image: gopalarao2004/foodspot-frontend:b12-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
