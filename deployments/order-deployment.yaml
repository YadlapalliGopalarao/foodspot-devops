
# FoodSpot - Order Service Kubernetes Deployment
# Jenkins automatically updates the Docker image tag.
# Argo CD deploys changes to Oracle OKE.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: order
  namespace: application
  labels:
    app: order

spec:
  selector:
    matchLabels:
      app: order

  template:
    metadata:
      labels:
        app: order

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33

      containers:
        - name: order-service
          image: gopalarao2004/foodspot-order:b12-0a88cac
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            # Laravel Application Configuration
            - name: APP_NAME
              value: "order-service"

            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: foodspot-order-app
                  key: APP_KEY

            - name: LOG_CHANNEL
              value: "stderr"

            - name: LOG_LEVEL
              value: "info"

            # MySQL Database Configuration
            - name: DB_CONNECTION
              value: "mysql"

            - name: DB_HOST
              value: "mysql.application.svc.cluster.local"

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              value: "foodspot_orders"

            - name: DB_USERNAME
              value: "foodspot"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password

            # Laravel Runtime Configuration
            - name: SESSION_DRIVER
              value: "array"

            - name: CACHE_STORE
              value: "file"

            - name: QUEUE_CONNECTION
              value: "sync"

            # Internal Microservice Communication
            - name: USER_SERVICE_URL
              value: "http://user"

            - name: FOOD_SERVICE_URL
              value: "http://food"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification"

            # Notification Service Authentication
            - name: NOTIFICATION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: foodspot-notification-auth
                  key: NOTIFICATION_SERVICE_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Temporary readiness check until
          # the application health endpoint is verified.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
